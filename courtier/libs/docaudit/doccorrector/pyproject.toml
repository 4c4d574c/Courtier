[project]
name = "doccorrector"
version = "1.0.0"
description = "Chinese text correction library — spelling, grammar, fullwidth/halfwidth, punctuation"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
