requires-python = ">=3.12"
dependencies = [
    "courtier-plugin-sdk",
]

[tool.uv.sources]
courtier-plugin-sdk = { path = "../../shared/plugin_sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
