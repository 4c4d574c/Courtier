name: detect_plagiarism
version: "1.0.0"
api: "2.0"
description: "Plagiarism detection using dynamic IQR thresholding"
# Full pipeline over a large reference library (per-segment similarity +
# dynamic IQR thresholding) can exceed the default; align with the other
# audit plugins' generous budgets.
timeout_ms: 300000

# Tool declarations and usage guidance are runtime-registered from entry.py
# (register_tool / register_capabilities) — no capabilities block here.
runtime:
  port: 9108

dependencies:
  host_services:
    - cache
  permissions:
    - read:cache
    - write:cache
