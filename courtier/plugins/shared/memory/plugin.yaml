name: memory
version: "1.0.0"
api: "2.0"
description: "基于数据库的分层长期记忆（全局共享层 + 用户层），经 memory_store 宿主服务读写"

# Tool declarations and usage guidance are runtime-registered from entry.py
# (register_tool / register_capabilities) — no capabilities block here.
runtime:
  port: 9110

dependencies:
  host_services:
    - memory_store
  permissions:
    - read:memory
    - write:memory
