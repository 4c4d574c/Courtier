name: memory
version: "1.0.0"
api: "2.0"
description: "Layered DB-backed memory (global shared layer + per-user layer) via the memory_store host service"

# Tool declarations and usage guidance are runtime-registered from entry.py
# (register_tool / register_capabilities) — no capabilities block here.
runtime:
  port: 9110

dependencies:
  host_services:
    - memory_store
  permissions:
    - read:memory
    - write:memory
