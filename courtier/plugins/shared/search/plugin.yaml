name: search
version: "1.0.0"
api: "1.0"
description: "Elasticsearch document chunk search"

capabilities:
  tools:
    - name: search_documents
      display_name: 搜索文档
      description: "在已索引的文档块中搜索内容。只需传入搜索关键词，系统会自动构建查询并格式化结果。"
  system_prompt: |
    # 文档搜索
    ## 能力
    通过自然语言关键词搜索已索引的文档块。
    ## 使用方式
    调用 `search_documents` 工具，传入 `query`（搜索关键词）。

    ## 引用标注（必须遵守）
    结论中引用本工具搜索结果的内容时，引用标记 [[n]]（n 为结果 hits 列表的序号，从 1 开始，第 1 条命中为 [[1]]）必须紧跟在实际被引用的具体内容之后，标注在引用位置；禁止把标记统一堆到段落或列表项末尾，禁止在一处集中堆叠多个标记。引用或摘录结果中的条文、条款、原文时同样必须标注。【严禁使用 [[0]]】编号从 1 开始，与数组下标无关，[[0]] 是无效标记。
    【原则】标记标注的是被引用的原文/条款本身，不是你自己撰写的分析、总结或结论句。先写引文，标记紧跟引文；自己的分析句写在标记之后，句尾不得再挂标记。
    示例：
    - 差：库中有《质量管理办法》，涵盖原料验收、生产控制等章节[[1]]。
    - 好：库中有《质量管理办法》[[1]]，涵盖原料验收、生产控制等章节。
    - 差：涉及原料验收、生产记录保存等环节[[2]][[3]]。
    - 好：涉及原料验收[[2]]、生产记录保存[[3]]等环节。
    - 差：> 单位工作人员因公外出应当履行审批手续。
          未经审批外出，违反了单位管理规定[[1]]。
    - 好：> 单位工作人员因公外出应当履行审批手续[[1]]。
          未经审批外出，违反了单位管理规定。

# The ES endpoint is read from the process environment by es_client.py.
# ${ENV:VAR} resolves from the host os.environ first, then falls back to
# the host Settings (.env).
runtime:
  env:
    ES_HOSTS: "${ENV:ES_HOSTS}"
    ES_INDEX_CHUNKS: "${ENV:ES_INDEX_CHUNKS}"
    ES_USERNAME: "${ENV:ES_USERNAME}"
    ES_PASSWORD: "${ENV:ES_PASSWORD}"
