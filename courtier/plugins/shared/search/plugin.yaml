name: search
version: "1.0.0"
api: "1.0"
description: "Elasticsearch document chunk search"

# Runtime tool registration happens in entry.py (register_tool); tool-
# usage and citation guidance for the model lives in the core
# behavioral.yaml prompt bundle (single source of truth). Do NOT add a
# capabilities block or system_prompt here: the host only consumes the
# register notification sent by entry.py, so manifest-level prompt text
# would be dead config that silently drifts from the live rules.
#
# The ES endpoint is read from the process environment by es_client.py.
# ${ENV:VAR} resolves from the host os.environ first, then falls back to
# the host Settings (.env).
runtime:
  env:
    ES_HOSTS: "${ENV:ES_HOSTS}"
    ES_INDEX_CHUNKS: "${ENV:ES_INDEX_CHUNKS}"
    ES_USERNAME: "${ENV:ES_USERNAME}"
    ES_PASSWORD: "${ENV:ES_PASSWORD}"
    # LLM endpoint for query embeddings (hybrid search) and listwise rerank.
    LLM_IP: "${ENV:LLM_IP}"
    LLM_API_KEY: "${ENV:LLM_API_KEY}"
    LLM_NAME: "${ENV:LLM_NAME}"
    LLM_EMBEDDING_NAME: "${ENV:LLM_EMBEDDING_NAME}"
    LLM_EMBEDDING_DIM: "${ENV:LLM_EMBEDDING_DIM}"
    LLM_EMBEDDING_BATCH_SIZE: "${ENV:LLM_EMBEDDING_BATCH_SIZE}"
