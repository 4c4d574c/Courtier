name: search
version: "1.0.0"
api: "1.0"
description: "Elasticsearch document chunk search"

capabilities:
  tools:
    - name: search_documents
      display_name: 搜索文档
      description: "在已索引的文档块中搜索内容。只需传入搜索关键词，系统会自动构建查询并格式化结果。"
  system_prompt: |
    # 文档搜索
    ## 能力
    通过自然语言关键词搜索已索引的文档块。
    ## 使用方式
    调用 `search_documents` 工具，传入 `query`（搜索关键词）。

    ## 引用标注（必须遵守）
    结论中引用本工具搜索结果的内容时，引用标记 [[n]]（n 为结果 hits 列表的序号，从 1 开始）必须紧跟在实际被引用的具体内容之后，标注在引用位置；禁止把标记统一堆到段落或列表项末尾，禁止在一处集中堆叠多个标记。引用或摘录结果中的条文、条款、原文时同样必须标注。
    【原则】标记标注的是被引用的原文/条款本身，不是你自己撰写的分析、总结或结论句。先写引文，标记紧跟引文；自己的分析句写在标记之后，句尾不得再挂标记。
    示例：
    - 差：库中有《数据安全法》，涵盖数据安全与发展、数据安全制度、数据安全保护义务等章节[[1]]。
    - 好：库中有《数据安全法》[[1]]，涵盖数据安全与发展、数据安全制度、数据安全保护义务等章节。
    - 差：此外还涉及数据分类分级保护、数据安全风险评估与应急处置等配套条款[[2]][[3]]。
    - 好：此外还涉及数据分类分级保护[[2]]、数据安全风险评估与应急处置[[3]]等配套条款。
    - 差：> 国家秘密载体的制作、收发、传递、使用、复制、保存、维修和销毁，应当符合国家保密规定。
          将光盘带回家中，违反了涉密载体的保存和携带管理规定[[1]]。
    - 好：> 国家秘密载体的制作、收发、传递、使用、复制、保存、维修和销毁，应当符合国家保密规定[[1]]。
          将光盘带回家中，违反了涉密载体的保存和携带管理规定。

# The ES endpoint is read from the process environment by es_client.py.
# ${ENV:VAR} resolves from the host os.environ first, then falls back to
# the host Settings (.env).
runtime:
  env:
    ES_HOSTS: "${ENV:ES_HOSTS}"
    ES_INDEX_CHUNKS: "${ENV:ES_INDEX_CHUNKS}"
    ES_USERNAME: "${ENV:ES_USERNAME}"
    ES_PASSWORD: "${ENV:ES_PASSWORD}"
