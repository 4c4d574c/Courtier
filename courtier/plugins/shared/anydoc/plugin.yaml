name: anydoc
version: "1.0.0"
api: "2.0"
description: "Generic office document conversion to Markdown (Word/Excel/PowerPoint/OpenDocument/RTF/EPUB/CSV/PDF) with OCR fallback for scanned files"
# Conversion is a single Rust call measured in milliseconds; the timeout is
# generous headroom for very large files and multi-page OCR jobs.
timeout_ms: 300000

# Tool declarations and usage guidance are runtime-registered from entry.py
# (register_tool / register_capabilities) — no capabilities block here.
# The OCR fallback reads ANYDOC_OCR_API_URL from the plugin's own process
# environment (see plugins/plugin.env.example).
runtime:
  port: 9102
