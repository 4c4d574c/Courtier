name: anydoc
version: "1.0.0"
api: "1.0"
description: "Generic office document conversion to Markdown (Word/Excel/PowerPoint/OpenDocument/RTF/EPUB/CSV/PDF)"
# Conversion is a single Rust call measured in milliseconds; the timeout is
# generous headroom for very large files only.
timeout_ms: 60000

capabilities:
  tools:
    - name: convert_document
      display_name: 转换文档
      description: "Convert an office document (doc/docx/xls/xlsx/ppt/pptx/odt/ods/odp/rtf/epub/csv/text-based PDF) into GitHub-Flavored Markdown. No OCR: scanned or image-only PDFs are rejected."
