name: annotate
version: "1.0.0"
api: "1.0"
description: "DOCX keyword-based annotation"

capabilities:
  tools:
    - name: annotate_document
      display_name: 文档批注
      description: "Add Word comments to a DOCX document at keyword occurrences."
  system_prompt: |
    # 文档批注
    ## 能力
    在 DOCX 文档中根据关键词自动添加 Word 批注（comments）。
