orchestrator:
  # system_prompt intentionally omitted — falls back to the core default
  # (domain-agnostic orchestrator identity + activation guidance).
  task_decomposition: |
    Decompose the following task into executable subtasks:
    {{ task }}

    Available Skills: {{ available_skills | map(attribute='name') | join(', ') }}

  workflow_rules: |
    # Workflow Rules (docaudit activation payload)

    ## Data-fetching rules
    1. **No uploaded file** (user pasted text directly) → no conversion or
       parsing tools needed: pass the user's text as the skill task body (or
       text input) directly; the skill works on that text.
    2. **Format audit** (format_audit) → call parse_document to obtain the
       Document model (layout/font metrics). If parsing fails, stop and
       report — do not continue.
    3. **Content tasks** (content_audit / plagiarism / secret_analysis;
       text-correction requests are handled by the content_audit skill) and
       read-and-answer:
       - 【Never call parse_document】parse_document is for format audit only;
         content tasks must not call it;
       - Prefer reusing document text already in the session (Markdown from
         convert_document, or the text projection of an earlier parse) — do not
         re-convert or re-parse;
       - When no text is available yet, call convert_document(file_path) and
         pass the resulting Markdown as the text input (scanned files are
         OCR'd automatically).
    4. Forward file_path to Skills (when present). Put the document body into
       the task as a $ref reference (e.g. "Audit the body:
       $ref:convert_document:1") — the system expands it into the full text at
       the tool boundary before the sub-agent runs.
       【Never】get_artifact-read the full text and paste it into the task.

    ## Audit workflow
    1. Once the document is ready, immediately call the most appropriate
       Skill tool. Do not write a plan in text before calling.
    2. Never call the same Skill twice. After a Skill returns, produce the
       final conclusion directly. Do not ask "do you also need..."

    # Final Output Format
    Final conclusions must use Markdown with headings (##), lists (-), and tables.
    - Start with a ## heading summarizing the type and document name
    - Use ### subsections for each dimension
    - List issues with location, severity, and suggested fixes
    - End with an overall assessment and prioritized recommendations
    - Skills may output structured formats (e.g. JSON); convert them to
      Markdown in the final conclusion.

    # Skill Execution Mode Selection
    Every Skill tool requires the mode parameter:
    - mode="subagent": independent sub-agent for complex tasks
    - mode="inline": inline instructions for simple tasks
    Principle: composite tasks -> subagent; single-dimension -> inline.
    Large documents or detailed reports may also warrant subagent.

    # get_artifact Usage
    1. To read Skill/tool results: pass only the id parameter using the
       result_id field from tool output ($ref:...:N format).
       Do not pass artifact_type.
    2. The id parameter also accepts the artifact_id field value from
       list_artifacts output (note: the parameter name is id, not
       artifact_id). Passing id alone returns the data.
    3. For type conversion: pass id + artifact_type (see
       projectable_to_types) to run the projection chain.

    # Parse Warnings
    When a tool result contains parse warnings (warnings / warnings_summary,
    e.g. scanned pages not recognized, missing page content), state them
    honestly in the final conclusion — never silently ignore them.

    # Unchecked Items
    "unchecked" entries in audit results are NOT errors and must not be
    counted in the error count. If the conclusion needs to mention them,
    state the reason honestly (e.g. "scanned pages cannot be measured for
    margins/font size") instead of listing them as issues or fixes.

    # Structured Parameter Passing
    Data fields (e.g. document) accept two forms:
    1. $ref cache reference string — recommended
    2. Full JSON object — only for small data
