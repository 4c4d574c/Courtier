[project]
name = "courtier"
version = "0.2.0"
description = "General-purpose AI agent platform with pluggable domain packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.18.4",
    "asyncmy>=0.2.11",
    "cryptography>=46.0.7",
    "docxnote>=0.2.0",
    "elasticsearch==8.17.0",
    "elastic-transport==8.17.0",
    "fastapi>=0.135.3",
    "fastapi-offline>=1.7.6",
    "httpx>=0.28.1",
    "lxml>=6.0.4",
    "numpy>=2.4.4",
    "pillow>=11.0.0",
    "openai>=2.31.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.2.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "prometheus-client>=0.25.0",
    "pyjwt>=2.13.0",
    "slowapi>=0.1.10",
    "bcrypt>=5.0.0",
    "content_compliance",
    "courtier-plugin-sdk",
    "docannot",
    "docmodels",
    "docparse",
    "jinja2>=3.1.6",
    "click>=8.3.2",
    "minio>=7.2.20",
    "validator",
]

[project.scripts]
courtier = "courtier.cli.main:main"

[tool.uv.sources]
content_compliance = { path = "libs/docaudit/content_compliance", editable = true }
courtier-plugin-sdk = { path = "libs/shared/plugin_sdk", editable = true }
docannot = { path = "libs/shared/docannot", editable = true }
docmodels = { path = "libs/shared/docmodels", editable = true }
docparse = { path = "libs/docaudit/docparse", editable = true }
validator = { path = "libs/docaudit/validator", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=25.0.0",
    "isort>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "types-pyyaml>=6.0.12.20260518",
    "aiosqlite>=0.22.1",
]

[tool.coverage.run]
source = ["courtier", "domains/docaudit", "libs/shared", "libs/docaudit", "plugins"]

[tool.coverage.report]
fail_under = 0

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["courtier", "domains/docaudit", "plugins"]
testpaths = ["tests"]
norecursedirs = ["data", ".worktrees", "node_modules", ".venv"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    "ignore::pytest.PytestWarning:marker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["courtier", "domains/docaudit"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["courtier"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
