errors:
  # —— Tool execution ——
  tool_timeout: "Tool execution timed out ({{ timeout_seconds }}s): {{ tool_name }}"
  tool_arg_parse: "Failed to parse arguments for tool '{{ tool_name }}'. Raw arguments: {{ raw_arguments }}"
  tool_exception: "Tool '{{ tool_name }}' raised an exception: {{ error }}"
  tool_not_found: "Tool '{{ tool_name }}' is not registered and cannot be called. Available tools: {{ available_tools }}. Use one of the available tools, or answer with text directly."
  tool_max_calls_exceeded: "Tool '{{ tool_name }}' has been called {{ count }} times, exceeding the limit of {{ limit }}. Reduce unnecessary calls."
  tool_max_consecutive_exceeded: "Tool '{{ tool_name }}' has been called {{ count }} consecutive times, exceeding the limit of {{ limit }}. Adjust the calling pattern."
  tool_missing_param: "Tool '{{ tool_name }}' is missing required parameter '{{ param_name }}'{% if hint %} ({{ hint }}){% endif %}."
  result_unknown_error: "'{{ actor_name }}' failed without returning a specific error message."
  artifact_store_unavailable: "Artifact store is unavailable; cannot {{ action }}."
  # —— Loop layer ——
  permission_denied: "Permission denied: the following tools were refused: {{ denied_tools }}"
  internal_error: "Internal error: {{ message }}"
  model_error: "Model call failed: {{ error }}"
  # —— Skill / sub-agent ——
  skill_input_validation: "Skill '{{ skill_name }}' received invalid input:\n{{ error_details }}\nFix the listed fields and call again."
  skill_missing_mode: "Skill '{{ skill_name }}' requires a 'mode' parameter. Use mode=\"subagent\" (complex task) or mode=\"inline\" (simple task)."
  skill_runtime_unavailable: "Skill '{{ skill_name }}' cannot run: AgentRuntime is unavailable."
  skill_spawn_failed: "Failed to spawn skill '{{ skill_name }}': {{ error }}"
  skill_failed: "Skill '{{ skill_name }}' failed: {{ error }}"
  skill_inline_missing_tools: "Inline mode cannot execute skill '{{ skill_name }}': missing required tools {{ missing_tools }}. Use mode='subagent' to run an isolated sub-agent, or fetch data via list_artifacts / get_artifact from the artifact store."
  subagent_unknown: "Unknown agent or skill: {{ agent_name }}"
  subagent_timeout: "Sub-agent timed out after {{ timeout_seconds }}s"
  subagent_terminated: "Sub-agent was terminated"
  subagent_budget_exhausted: "Cumulative runtime budget exhausted ({{ used_seconds }}s / {{ limit_seconds }}s)"
  subagent_spawn_refused: "Cannot spawn sub-agent {{ agent_name }}: {{ reason }}"
  budget_max_depth: "maximum sub-agent nesting depth reached ({{ max_depth }})"
  budget_spawn_exhausted: "total spawn budget exhausted"
  budget_spawn_cycle: "spawn cycle detected: {{ agent_name }} (the same agent cannot spawn recursively along one chain)"
  budget_child_allocate: "Cannot allocate child budget: {{ reason }}"
  subagent_max_steps: "Sub-agent hit the max-steps limit ({{ max_steps }} steps) without completing the task"
  subagent_missing_registry: "Sub-agent has no tool registry and cannot execute tool calls"
  guard_null_tool_results: "{{ count }} consecutive tool calls returned empty results"
  guard_repeated_calls: "{{ count }} repeated calls to tool {{ tool_name }} with identical arguments"
  guard_consecutive_exploratory: "{{ count }} consecutive exploratory tool calls (list_artifacts/get_artifact) without business output"
  guard_no_artifact_progress: "{{ turns }} turns without new business artifacts"
  guard_tool_blocked: "Tool {{ tool_name }} is blocked by policy: {{ cause }}"
  subagent_failed: "Sub-agent execution failed: {{ error }}"
  # —— Plugin channel ——
  plugin_arg_path_escape: "Argument {{ param_name }} escapes the upload directory and was rejected: {{ value }}"
  plugin_arg_file_missing: "File referenced by argument {{ param_name }} does not exist: {{ value }}"
  plugin_file_transfer_failed: "Failed to transfer file to object storage: {{ error }}"
  plugin_bad_response_type: "Plugin {{ plugin_name }} tool {{ tool_name }} returned an unexpected response type: {{ response_type }}"
  plugin_missing_success_field: "Plugin {{ plugin_name }} tool {{ tool_name }} response is missing the 'success' field"
  plugin_call_timeout: "Plugin '{{ plugin_name }}' call timed out ({{ timeout }}s); retry or split the task"
  plugin_crashed: "Plugin '{{ plugin_name }}' crashed or disconnected"
  # —— Built-in tools ——
  memory_unavailable: "Memory is unavailable (the current context manager does not support the memory tier)."
  activate_domain_not_wired: "Activator not wired: activate_domain requires a DomainActivator bound at orchestrator build time"
  # —— Artifact binding / projection ——
  binder_field_unresolved: "Could not resolve required field {{ field_name }} (type {{ artifact_type }})"
  binder_text_below_min: "Field {{ field_name }}: text length {{ length }} is below minimum {{ min_chars }} characters"
  binder_text_above_max: "Field {{ field_name }}: text length {{ length }} exceeds maximum {{ max_chars }} characters"
  binder_items_below_min: "Field {{ field_name }}: {{ length }} items is below minimum {{ min_items }}"
  binder_items_above_max: "Field {{ field_name }}: {{ length }} items exceeds maximum {{ max_items }}"
  binder_item_text_below_min: "Field {{ field_name }}: item {{ index }} has {{ length }} chars, below minimum {{ item_min_chars }}"
  artifact_ref_not_found_hint: "This reference does not exist or is outside the current task's visibility. Use a result_id actually returned by a tool in the current task chain, or call list_artifacts first to see available artifacts."
  artifact_missing_id: "The 'id' parameter is required. Use the result_id field from tool output ($ref:...:N format), or the artifact_id field value returned by list_artifacts."
  artifact_projection_unsatisfied: "Artifact type {{ artifact_type }} cannot be projected to satisfy the request (materialize_as={{ materialize_as }}, constraints={{ constraints }}). Use a projectable target type with the artifact_type parameter (see projectable_to_types in list_artifacts output), or omit materialize_as/source_scope and read the raw data directly."
  artifact_data_not_found: "No artifact data found for id={{ id }}. The id parameter accepts: a result_id from tool output ($ref:...:N format), or an artifact_id field from list_artifacts output; add artifact_type when a type conversion is needed (see projectable_to_types)."
  artifact_outline_unsupported: "Result {{ id }} does not support outline/section reading: only text results (Markdown/plain text) and parse_layout output qualify. Read the raw data via get_artifact directly, or add materialize_as=string to extract the body text."
  artifact_section_not_found: "Section '{{ section }}' not found. Available sections (index + title): {{ candidates }}{% if truncated %}…{% endif %}"
  artifact_outline_missing_params: "Structured reading requires the outline or section parameter"
  artifact_typed_ref_not_found: "No typed artifact found for reference {{ id }}; cannot run the requested projection. Omit materialize_as/source_scope and read the raw data directly, or call list_artifacts first to see available artifacts."
  artifact_read_failed: "Failed to read the persisted result: {{ error }}"
  artifact_empty_data: "Data of result {{ id }} is empty"
  artifact_id_not_found: "Artifact not found for artifact_id={{ artifact_id }}. {{ hint }}"
  artifact_hint_persisted_ref: "(Hint: {{ artifact_id }} is a persisted reference — pass it directly as id to read the raw data; no need to call list_artifacts first.)"
  artifact_hint_list_artifacts: "Call list_artifacts first to see available artifacts and their artifact_id."
  artifact_projection_resolve_failed: "Cannot obtain the requested artifact: {{ messages }}{% if suggested_tools %}. Consider calling these upstream tools first: {{ suggested_tools }}{% endif %}"
  artifact_projection_exec_failed_typed: "Projection failed: {{ error }}. Materializable artifact types: {{ available_types }}. If the source artifact type (e.g. docaudit.parsed_document) is not directly materializable, request a projection target type (e.g. core.plain_text or docaudit.paragraph_list); the system runs the type-projection chain automatically."
  artifact_projection_exec_failed: "Projection failed: {{ error }}"
