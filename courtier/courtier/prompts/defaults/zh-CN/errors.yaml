errors:
  # —— 工具执行 ——
  tool_timeout: "工具执行超时（{{ timeout_seconds }}秒）：{{ tool_name }}"
  tool_arg_parse: "工具 {{ tool_name }} 的参数解析失败。原始参数：{{ raw_arguments }}"
  tool_exception: "工具 {{ tool_name }} 执行异常：{{ error }}"
  tool_not_found: "工具 {{ tool_name }} 未注册，无法调用。当前可用工具：{{ available_tools }}。请改用可用工具，或直接给出文本回答。"
