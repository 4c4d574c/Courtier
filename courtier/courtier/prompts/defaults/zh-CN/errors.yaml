  artifact_store_unavailable: "Artifact store 不可用，无法{{ action }}。"
  # —— 循环层 ——
  permission_denied: "权限不足，以下工具被拒绝调用：{{ denied_tools }}"
  internal_error: "内部错误：{{ message }}"
  model_error: "模型调用失败：{{ error }}"
