  artifact_data_not_found: "未找到 id={{ id }} 的工件数据。id 参数可填：工具输出中的 result_id（$ref:...:N 格式），或 list_artifacts 输出中的 artifact_id 字段值；需要转换类型时再附带 artifact_type（取值见 projectable_to_types）。"
  artifact_outline_unsupported: "结果 {{ id }} 不支持大纲/按节读取：仅文本类结果（Markdown/纯文本）与 parse_document 解析结果可用。可直接 get_artifact 读取原始数据，或加 materialize_as=string 提取正文文本。"
  artifact_section_not_found: "未找到节「{{ section }}」。可用节（序号+标题）: {{ candidates }}{% if truncated %}…{% endif %}"
  artifact_outline_missing_params: "结构化读取需要 outline 或 section 参数"
  artifact_typed_ref_not_found: "未找到引用 {{ id }} 的类型化工件，无法执行投影请求。请省略 materialize_as/source_scope 等参数直接读取原始数据，或先调用 list_artifacts 查看可用工件。"
  artifact_read_failed: "读取持久化结果失败: {{ error }}"
  artifact_empty_data: "结果 {{ id }} 的数据为空"
  artifact_id_not_found: "未找到 artifact_id={{ artifact_id }} 的工件。{{ hint }}"
  artifact_hint_persisted_ref: "（提示：{{ artifact_id }} 是持久化引用，直接作为 id 传入即可读取原始数据，无需先调 list_artifacts。）"
  artifact_hint_list_artifacts: "请先调用 list_artifacts 查看可用工件及其 artifact_id。"
  artifact_projection_resolve_failed: "无法获取请求的 artifact：{{ messages }}{% if suggested_tools %}。建议先调用以下上游工具：{{ suggested_tools }}{% endif %}"
  artifact_projection_exec_failed_typed: "投影执行失败: {{ error }}。当前可物化的 artifact_type: {{ available_types }}。如果源 artifact 类型（如 docaudit.parsed_document）不可直接物化，请尝试请求投影目标类型（如 core.plain_text 或 docaudit.paragraph_list），系统会自动执行类型投影链。"
  artifact_projection_exec_failed: "投影执行失败: {{ error }}"
