  binder_text_below_min: "字段 {{ field_name }} 的文本长度 {{ length }} 低于最小长度 {{ min_chars }} 字符"
  binder_text_above_max: "字段 {{ field_name }} 的文本长度 {{ length }} 超过最大长度 {{ max_chars }} 字符"
  binder_items_below_min: "字段 {{ field_name }} 只有 {{ length }} 项，低于最小数量 {{ min_items }}"
  binder_items_above_max: "字段 {{ field_name }} 有 {{ length }} 项，超过最大数量 {{ max_items }}"
  binder_item_text_below_min: "字段 {{ field_name }} 第 {{ index }} 项长度 {{ length }} 字符，低于最小长度 {{ item_min_chars }} 字符"
