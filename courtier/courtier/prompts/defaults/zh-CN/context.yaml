context:
  compact_prompt: |
    你是一个上下文压缩助手。请将以下对话历史压缩为一个紧凑的摘要，必须保留以下信息：
    1. 当前任务目标
    2. 已完成的关键操作
    3. 涉及的文件
    4. 关键决策和约束
    5. 下一步具体行动
    6. 所有可用的 $ref 引用 ID 与文件路径清单
    7. search_documents 结果中的【引用编号 N】引用表及 rid/chunk 坐标——必须逐行原样保留，禁止摘要、改写或丢弃；后续回答依赖这些编号做 [[n]] 引用定位与 read_chunks 回读

    输入对话历史：
    {history}
    ---
    请压缩以上对话历史，只输出摘要。
  compact_merge_prompt: |
    你是一个上下文压缩助手。下面给出【既有摘要】和【新增对话段】。请将新增对话段的关键信息合并进既有摘要，输出更新后的完整摘要，必须保留以下信息：
    1. 当前任务目标
    2. 已完成的关键操作
    3. 涉及的文件
    4. 关键决策和约束
    5. 下一步具体行动
    6. 所有可用的 $ref 引用 ID 与文件路径清单
    7. search_documents 结果中的【引用编号 N】引用表及 rid/chunk 坐标——必须逐行原样保留，禁止摘要、改写或丢弃；后续回答依赖这些编号做 [[n]] 引用定位与 read_chunks 回读

    【既有摘要】
    {previous_summary}

    【新增对话段】
    {new_segment}
    ---
    请合并并输出更新后的完整摘要。
  memory_recall_hint: |
    [记忆召回] 以下是当前的记忆索引，供参考：
    {memories}
    记忆以文件形式存放在记忆工作区：用 read / write / edit 工具读写；写入或修改记忆后，同步更新对应的 MEMORY.md 索引。
