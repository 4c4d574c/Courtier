context:
  compact_prompt: |
    你是一个上下文压缩助手。请将以下对话历史压缩为一个紧凑的摘要，必须保留以下信息：
    1. 当前任务目标
    2. 已完成的关键操作
    3. 涉及的文件
    4. 关键决策和约束
    5. 下一步具体行动
    6. 所有可用的 $ref 引用 ID 与文件路径清单
    7. search_documents 结果中的【引用编号 N】引用表及 rid/chunk 坐标——必须逐行原样保留，禁止摘要、改写或丢弃；后续回答依赖这些编号做 [[n]] 引用定位与 read_chunks 回读

    输入对话历史：
    {history}
    ---
    请压缩以上对话历史，只输出摘要。
  compact_merge_prompt: |
    你是一个上下文压缩助手。下面给出【既有摘要】和【新增对话段】。请将新增对话段的关键信息合并进既有摘要，输出更新后的完整摘要，必须保留以下信息：
    1. 当前任务目标
    2. 已完成的关键操作
    3. 涉及的文件
    4. 关键决策和约束
    5. 下一步具体行动
    6. 所有可用的 $ref 引用 ID 与文件路径清单
    7. search_documents 结果中的【引用编号 N】引用表及 rid/chunk 坐标——必须逐行原样保留，禁止摘要、改写或丢弃；后续回答依赖这些编号做 [[n]] 引用定位与 read_chunks 回读

    【既有摘要】
    {previous_summary}

    【新增对话段】
    {new_segment}
    ---
    请合并并输出更新后的完整摘要。
  memory_recall_hint: |
    [记忆召回] 以下是当前可用的长期记忆索引（用户层在前，条目标题后括号内为领域包归类）：
    {memories}
    记忆存放在数据库中：用 memory 工具 list / read 查看全文，write / delete 维护（write 默认写入你的用户层；layer=global 为全局共享层，仅管理员可写；domain 省略为通用，填领域包名则为领域记忆）。
