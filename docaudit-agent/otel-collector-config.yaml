receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse:3000/api/public/otlp
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH_HEADER}"
    # LANGFUSE_AUTH_HEADER must be set to the base64 encoding of
    #   publicKey:secretKey
    # e.g. export LANGFUSE_AUTH_HEADER=$(echo -n "pk:sk" | base64)
  prometheus:
    endpoint: 127.0.0.1:8889
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, memory_limiter]
      exporters: [otlphttp/langfuse, debug]
    metrics:
      receivers: [otlp]
      processors: [batch, memory_limiter]
      exporters: [prometheus, debug]
